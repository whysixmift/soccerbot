; PlatformIO Project Configuration for Mini Soccer Robot System
; Targets:
;   - robot_bot1 : ESP32 DevKit V1 for Robot 1 (BOT_1 pinout, Bluepad32 DualShock 4)
;   - robot_bot2 : ESP32 DevKit V1 for Robot 2 (BOT_2 pinout, Bluepad32 DualShock 4)

[platformio]
default_envs = robot_bot1, robot_bot2

[common]
platform = espressif32@6.10.0
framework = arduino
platform_packages = 
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
build_src_filter = 
    +<common/*>
    +<robot/*>
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter

[env:robot_bot1]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
board_build.partitions = ${common.board_build.partitions}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
    ${common.build_flags}
    -DTARGET_ROBOT
    -DBOT_VARIANT_BOT_1
    -DROBOT_ID=1
    -DLOG_LEVEL=3

[env:robot_bot2]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
board_build.partitions = ${common.board_build.partitions}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
    ${common.build_flags}
    -DTARGET_ROBOT
    -DBOT_VARIANT_BOT_2
    -DROBOT_ID=2
    -DLOG_LEVEL=3
