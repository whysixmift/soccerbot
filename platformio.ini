; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = robot_bot1, robot_bot2


[common]
platform = espressif32@6.10.0
framework = arduino
platform_packages = 
	framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
build_src_filter = 
	+<common/*>
	+<robot/*>
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-Wall
	-Wextra
	-Wno-unused-parameter

[env:robot_bot1]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
board_build.partitions = ${common.board_build.partitions}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-DTARGET_ROBOT
	-DBOT_VARIANT_BOT_1
	-DROBOT_ID=1
	-DLOG_LEVEL=3

[env:robot_bot2]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = esp32-c3-devkitm-1
board_build.partitions = ${common.board_build.partitions}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-DTARGET_ROBOT
	-DBOT_VARIANT_BOT_2
	-DROBOT_ID=2
	-DLOG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1


[env:native]
platform = native
test_build_src = yes
build_src_filter = 
	+<common/*>
	+<robot/kinematics.cpp>
	+<robot/failsafe.cpp>
build_flags = 
	-Iinclude
	-DNATIVE_TEST


